name: jupyter
services:
  cassandra:
    container_name: cassandra-container
    image: cassandra:latest
    networks:
      mybridge: null
    ports:
      - mode: ingress
        target: 9042
        published: "9042"
        protocol: tcp
    volumes:
      - type: volume
        source: cassandra_data
        target: /var/lib/cassandra
        volume: {}
      - type: bind
        source: /opt/idp-bigdata/jupyter/datasets
        target: /datasets
        bind:
          create_host_path: true
  cassandra-web:
    command:
      - /wait-for-it.sh
      - cassandra:9042
      - --
      - ./service
      - -c
      - config.yaml
    container_name: cassandra-web-container
    depends_on:
      cassandra:
        condition: service_started
        required: true
    environment:
      CASSANDRA_HOST: cassandra
      CASSANDRA_PASSWORD: cassandra
      CASSANDRA_PORT: "9042"
      CASSANDRA_USERNAME: cassandra
      HOST_PORT: :80
      READ_ONLY: "false"
    image: ipushc/cassandra-web
    networks:
      mybridge: null
    ports:
      - mode: ingress
        target: 80
        published: "3000"
        protocol: tcp
    volumes:
      - type: bind
        source: /opt/idp-bigdata/jupyter/wait-for-it.sh
        target: /wait-for-it.sh
        bind:
          create_host_path: true
  jupyter:
    build:
      context: /opt/idp-bigdata/jupyter
      dockerfile: Dockerfile
    networks:
      mybridge: null
    ports:
      - mode: ingress
        target: 8888
        published: "8888"
        protocol: tcp
    volumes:
      - type: bind
        source: /opt/idp-bigdata/jupyter/notebooks
        target: /home/jovyan/work
        bind:
          create_host_path: true
      - type: bind
        source: /opt/idp-bigdata/jupyter/data
        target: /home/jovyan/data
        bind:
          create_host_path: true
      - type: bind
        source: /opt/idp-bigdata/jupyter/config
        target: /home/jovyan/.jupyter
        bind:
          create_host_path: true
  mongo:
    container_name: mongo_service
    environment:
      MONGO_INITDB_ROOT_PASSWORD: mongo
      MONGO_INITDB_ROOT_USERNAME: root
    image: mongo:4.4-bionic
    networks:
      mybridge: null
    ports:
      - mode: ingress
        target: 27017
        published: "27017"
        protocol: tcp
    volumes:
      - type: volume
        source: dbdata
        target: /data/db
        volume: {}
      - type: bind
        source: /opt/idp-bigdata/jupyter/db-seed
        target: /db-seed
        bind:
          create_host_path: true
      - type: bind
        source: /opt/idp-bigdata/jupyter/datasets
        target: /datasets
        bind:
          create_host_path: true
  mongo-express:
    command:
      - /wait-for-it.sh
      - mongo:27017
      - --
      - npm
      - start
    container_name: mongo_express_service
    depends_on:
      mongo:
        condition: service_started
        required: true
    environment:
      ME_CONFIG_MONGODB_ADMINPASSWORD: pass
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_URL: mongodb://root:mongo@mongo:27017/
    image: mongo-express:latest
    networks:
      mybridge: null
    ports:
      - mode: ingress
        target: 8081
        published: "8081"
        protocol: tcp
    volumes:
      - type: bind
        source: /opt/idp-bigdata/jupyter/wait-for-it.sh
        target: /wait-for-it.sh
        bind:
          create_host_path: true
networks:
  mybridge:
    name: mybridge
    driver: bridge
    external: true
volumes:
  cassandra_data:
    name: jupyter_cassandra_data
  dbdata:
    name: jupyter_dbdata
